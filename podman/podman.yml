version: '3.8'

services:
  database-lab1:
    image: docker.io/library/postgres:18.6-alpine
    container_name: database-lab1
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./Lab1/logs:/var/lib/pgadmin/
    networks:
      - lab1-network

  tomcat-lab1:
    image: docker.io/library/tomcat:11-jre25
    container_name: tomcat-lab1
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - database-lab1
    volumes:
      # Where the webapps should be deployed to
      - ./Lab1/webapps:/usr/local/tomcat/webapps
    networks:
      - lab1-network

volumes:
  database-storage-lab1:

networks:
  lab1-network:
    driver: bridge
